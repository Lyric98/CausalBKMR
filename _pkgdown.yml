navbar:
  type: default
  left:
    - icon: fa-home
      href: index.html
    - text: causalBKMR
      menu:
        - text: Overview of Methodology
          href: articles/gbkmr_method_overview.html
        - text: Quick Start
          href: articles/gbkmr_quickstart.html
        - text: Example 1 — Custom intervention contrasts
          href: articles/gbkmr_example_contrasts.html
        - text: Example 2 — Binary outcome
          href: articles/gbkmr_example_binary.html
        - text: Example 3 — Large sample (fastBKMR engine)
          href: articles/gbkmr_example_fastbkmr.html
        - text: Diagnostics & Troubleshooting
          href: articles/gbkmr_diagnostics.html
        - text: Causal Effect Plots
          href: articles/gbkmr_causal_plots.html
  right:
    - icon: fa-file-code-o
      text: Functions
      href: reference/index.html
    - icon: fa-github fa-lg
      text: GitHub
      href: https://github.com/Lyric-o/CausalBKMR

reference:
  - title: "Data Preparation"
    desc: "Convert user matrices to the current g-BKMR wide format"
    contents:
      - prepare_gbkmr_data

  - title: "Variable Detection"
    desc: "Detect mixture and time-varying covariate columns"
    contents:
      - detect_variable_patterns

  - title: "Analysis"
    desc: "Run the current g-BKMR analysis pipeline"
    contents:
      - gbkmr_run
      - run_gbkmr_panel

  - title: "Causal Effect Plots"
    desc: "Full g-formula causal contrasts and visualization"
    contents:
      - gbkmr_causal_overall
      - gbkmr_causal_univariate
      - gbkmr_causal_bivariate
      - gbkmr_causal_iqr
      - gbkmr_causal_interaction

  - title: "S3 Methods"
    desc: "Print methods for current result objects"
    contents:
      - print.gbkmr_detection
